name: Brix
options:
  bundleIdPrefix: com.spmsupun
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  PostgresNIO:
    url: https://github.com/vapor/postgres-nio
    from: 1.21.0
  MySQLNIO:
    url: https://github.com/vapor/mysql-nio
    from: 1.7.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Brix:
    type: application
    platform: macOS
    sources:
      - path: Brix
    dependencies:
      - package: SwiftTerm
      - package: PostgresNIO
      - package: MySQLNIO
      - package: GRDB
      - package: Sparkle
    info:
      path: Brix/Resources/Info.plist
      properties:
        CFBundleDisplayName: "$(BRIX_APP_NAME)"
        CFBundleName: "$(BRIX_APP_NAME)"
        BrixDataFolder: "$(BRIX_APP_NAME)"
        BrixKeychainService: "$(BRIX_KEYCHAIN_SERVICE)"
        CFBundleShortVersionString: "0.1.0-beta.19"
        CFBundleVersion: "172"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Supun Praneeth. MIT License."
        NSPrincipalClass: NSApplication
        # The hardened runtime blocks these unless a reason is given; commands
        # run in Brix's terminals and agents may need them.
        NSAppleEventsUsageDescription: "Brix runs your terminals and agents; commands you run in them may ask to control other apps."
        NSMicrophoneUsageDescription: "Brix runs your terminals and agents; commands you run in them may ask to use the microphone."
        NSCameraUsageDescription: "Brix runs your terminals and agents; commands you run in them may ask to use the camera."
        NSLocalNetworkUsageDescription: "Brix runs your terminals and agents; commands you run in them may ask to reach devices on your local network."
        # Sparkle: the feed is an asset of the newest GitHub release; every update
        # must be signed with the key whose public half is here.
        SUFeedURL: https://github.com/spmsupun/brix/releases/latest/download/appcast.xml
        SUPublicEDKey: VZjBMYUgGawS0JQBiTOTsF9oIZzG5br5fm5PO9X/iD0=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 14400
    entitlements:
      path: Brix/Resources/Brix.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spmsupun.brix
        BRIX_APP_NAME: Brix
        BRIX_KEYCHAIN_SERVICE: com.brix.credentials
        PRODUCT_NAME: Brix
        PRODUCT_MODULE_NAME: Brix
        EXECUTABLE_NAME: Brix
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
      # Debug builds are "Brix Dev": their own bundle id, name, icon, data folder
      # and Keychain entries, so they run beside an installed Brix without sharing
      # anything with it.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.spmsupun.brix.dev
          PRODUCT_NAME: Brix Dev
          BRIX_APP_NAME: Brix Dev
          BRIX_KEYCHAIN_SERVICE: com.brix.credentials.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
  BrixTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BrixTests
    dependencies:
      - target: Brix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spmsupun.brix.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Brix.app/Contents/MacOS/Brix"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Brix Dev.app/Contents/MacOS/Brix"
schemes:
  Brix:
    build:
      targets:
        Brix: all
        BrixTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BrixTests
